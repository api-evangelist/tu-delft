reviews:
  - date: '2026-06-03'
    rating: 3
    summary: >-
      TU Delft's strongest public API surface is research-data infrastructure:
      the 4TU.ResearchData repository (data.4tu.nl) exposes a documented public
      REST API (v2/v3, open-source "djehuty") plus OAI-PMH, and the TU Delft
      Repository publishes CC0 metadata via OAI-PMH. A NetID/OAuth2 SSO identity
      service is live. The general institutional API platform (api.tudelft.nl)
      is real and documented (campus/courses/education) but has been publicly
      announced as suspended with no new client registrations and did not
      resolve from this environment, so it is cataloged as legacy/gated. No
      fabricated endpoints: data.4tu.nl REST endpoints and djehuty/repository
      docs were verified live; api.tudelft.nl/apidoc.tudelft.nl did not resolve
      (status 0) and are reported as such. There is no single official TU Delft
      developer portal or GitHub org (research code lives under 4TUResearchData
      and other faculty orgs).
