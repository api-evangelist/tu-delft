apis:
  - aid: tu-delft:4tu-researchdata
    name: 4TU.ResearchData API
    x-operator: institution
    x-operator-evidence: >-
      data.4tu.nl resolves to 131.180.169.22, inside the RIPE inetnum 131.180.0.0/16, netname
      DUNET, org-name "Technische Universiteit Delft". re3data record r3d100010216 names TU
      Delft Library as a hosting institution for the repository, alongside the 4TU.Federation
      and the three partner universities. The software is 4TU's own open-source djehuty, not a
      vendor platform; GET /v3/groups returns the four consortium partners as depositing groups.
    description: >-
      Public REST API for the 4TU.ResearchData repository, the science/engineering/design
      research data repository of the 4TU.Federation, hosted and operated by TU Delft Library.
      Twelve endpoints verified live and unauthenticated on 2026-08-19: dataset listing, search,
      retrieval, files and versions on /v2; datasets and depositing groups on /v3; plus the
      license and category vocabularies. Depositor endpoints under /v2/account/ take an opaque
      personal bearer token. The /v2 surface is backward compatible with the Figshare v2 API
      shape as a migration requirement — uuid supersedes the numeric id and usage errors return
      precise HTTP codes rather than a blanket 400. Datasets carry versioned DataCite DOIs
      under the 10.4121 prefix and expose ORCID iDs on author records.
    humanURL: https://data.4tu.nl/
