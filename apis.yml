description: >-
  Delft University of Technology (TU Delft) is the oldest and largest public technical
  university in the Netherlands and a member of the 4TU.Federation. Its programmable footprint
  is narrow, and this profile states that plainly rather than padding it. TU Delft operates
  exactly one public, unauthenticated API: the 4TU.ResearchData repository at data.4tu.nl,
  which runs on djehuty, open-source repository software written by 4TU.ResearchData and
  Nikhef. The /v2 surface is deliberately shape-compatible with the Figshare v2 API because
  that was a requirement of the 2023 migration OFF Figshare — the contract is not Figshare's,
  and the service runs inside TU Delft's own RIPE netblock (DUNET, 131.180.0.0/16). The other
  genuinely institution-operated machine-readable surface is a SAML 2.0 identity provider at
  login.tudelft.nl, published into the SURFconext national federation and onward to eduGAIN.
  Beyond those two, the picture is retirement and tenancy. The general-purpose institutional
  API platform at api.tudelft.nl — campus, buildings, courses, schedules, study results,
  organisation — no longer answers on port 80 or 443, and its documentation host
  apidoc.tudelft.nl has no DNS record at all. The research information portal at
  pure.tudelft.nl / research.tudelft.nl is an Elsevier Pure tenancy whose own API
  documentation canonicalises to api.elsevierpure.com: TU Delft's data, Elsevier's contract.
  The library discovery layer is an OCLC WorldCat tenancy. No working OAI-PMH endpoint exists
  on any TU Delft-operated host despite third-party registry entries claiming otherwise. TU
  Delft publishes no OpenAPI, no llms.txt, no scope vocabulary and no API changelog.
