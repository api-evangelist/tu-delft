  - aid: tu-delft:pure
    name: Elsevier Pure research portal (TU Delft tenancy)
    x-operator: tenant
    x-operator-evidence: >-
      The API documentation served at https://pure.tudelft.nl/ws/api/ carries
      rel=canonical to https://api.elsevierpure.com/ws/api/index.html — the contract is
      Elsevier's product documentation running under a TU Delft hostname. The institution-specific
      subdomain makes this a tenancy, not an institutional API.
    description: >-
      TU Delft runs an Elsevier Pure current research information system, exposed to the public
      as the research portal at research.tudelft.nl / pure.tudelft.nl and to integrators as the
      Pure Web Service under /ws/api/ with a credential-gated OAI-PMH interface at /ws/oai
      (HTTP 401 — the interface exists and is gated, not absent). RECORDED AS A RELATIONSHIP,
      NOT A CONTRACT. The publications, people and project data are TU Delft's; the API surface
      that carries them is Elsevier's product and belongs on Elsevier's own scorecard. No Pure
      specification is saved into this repository, and nothing is derived from one. This entry
      exists so that a real institutional fact — TU Delft is a Pure customer — is on the record
      without a vendor's contract being credited to the university.
    humanURL: https://research.tudelft.nl/
    baseURL: https://pure.tudelft.nl/ws
    tags: [ Research Information, CRIS, Tenant, Elsevier Pure, Gated ]
    properties:
